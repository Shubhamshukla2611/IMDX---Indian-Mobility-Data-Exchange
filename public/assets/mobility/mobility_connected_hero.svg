<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" fill="none">
  <defs>
    <radialGradient id="heroAtmosphere" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#24221D" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0E0E0E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="roadTrail1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1E0CC" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#C5C2A8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#706E5B" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="roadTrail2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E6D9"/>
      <stop offset="100%" stop-color="#3D3C35" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="gridFade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E1E0CC" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E1E0CC" stop-opacity="0.01"/>
    </linearGradient>
    <filter id="glowBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep cinematic canvas -->
  <rect width="600" height="900" fill="url(#heroAtmosphere)"/>

  <!-- Perspective 3D Mobility Highway Mesh -->
  <g stroke="url(#gridFade)" stroke-width="1.2">
    <!-- Vanishing point perspective lines -->
    <line x1="300" y1="280" x2="30" y2="880"/>
    <line x1="300" y1="280" x2="120" y2="880"/>
    <line x1="300" y1="280" x2="220" y2="880"/>
    <line x1="300" y1="280" x2="300" y2="880" stroke-dasharray="8 6"/>
    <line x1="300" y1="280" x2="380" y2="880"/>
    <line x1="300" y1="280" x2="480" y2="880"/>
    <line x1="300" y1="280" x2="570" y2="880"/>

    <!-- Transverse road slices -->
    <line x1="285" y1="310" x2="315" y2="310"/>
    <line x1="265" y1="350" x2="335" y2="350"/>
    <line x1="240" y1="400" x2="360" y2="400"/>
    <line x1="205" y1="465" x2="395" y2="465"/>
    <line x1="160" y1="550" x2="440" y2="550"/>
    <line x1="100" y1="660" x2="500" y2="660"/>
    <line x1="30" y1="800" x2="570" y2="800"/>
  </g>

  <!-- Satellite / GNSS Constellation Downlink Arcs -->
  <g opacity="0.45" stroke="#DEDBC8" stroke-width="1">
    <ellipse cx="300" cy="200" rx="220" ry="80" stroke-dasharray="4 6"/>
    <ellipse cx="300" cy="200" rx="140" ry="50" stroke-dasharray="2 4"/>
    <ellipse cx="300" cy="200" rx="60" ry="20"/>
  </g>

  <!-- Sky Satellites / Nodes -->
  <g transform="translate(140, 160)">
    <circle r="4" fill="#DEDBC8" filter="url(#glowBlur)"/>
    <line x1="0" y1="0" x2="160" y2="120" stroke="#DEDBC8" stroke-opacity="0.2" stroke-dasharray="2 3"/>
  </g>
  <g transform="translate(460, 160)">
    <circle r="4" fill="#DEDBC8" filter="url(#glowBlur)"/>
    <line x1="0" y1="0" x2="-160" y2="120" stroke="#DEDBC8" stroke-opacity="0.2" stroke-dasharray="2 3"/>
  </g>
  <g transform="translate(300, 120)">
    <circle r="5" fill="#FAF8EE" filter="url(#glowBlur)"/>
    <line x1="0" y1="0" x2="0" y2="160" stroke="#DEDBC8" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  </g>

  <!-- Telemetry Highway Trails (Autonomous vehicle light beams) -->
  <path d="M300 280 Q 260 480 180 780" stroke="url(#roadTrail1)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowBlur)"/>
  <path d="M300 280 Q 340 480 420 780" stroke="url(#roadTrail2)" stroke-width="3.5" stroke-linecap="round" filter="url(#glowBlur)"/>

  <!-- Connected Vehicles on Highway with Telemetry Bubbles -->
  <!-- Vehicle 1: Left lane, mid distance -->
  <g transform="translate(245, 430)">
    <!-- Aura -->
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#DEDBC8" fill-opacity="0.08" stroke="#DEDBC8" stroke-opacity="0.4" stroke-width="1"/>
    <!-- Vehicle chassis vector -->
    <rect x="-8" y="-14" width="16" height="28" rx="5" fill="#202020" stroke="#DEDBC8" stroke-width="1.2"/>
    <!-- Headlights beam forward -->
    <polygon points="-5,-14 -12,-35 -1,-35 -3,-14" fill="#FAF8EE" fill-opacity="0.25"/>
    <polygon points="5,-14 3,-35 12,-35 5,-14" fill="#FAF8EE" fill-opacity="0.25"/>
    <!-- Pulse Ring -->
    <circle r="22" stroke="#DEDBC8" stroke-opacity="0.2" stroke-dasharray="2 3"/>
  </g>

  <!-- Vehicle 2: Right lane, foreground closer -->
  <g transform="translate(370, 560)">
    <!-- Aura -->
    <ellipse cx="0" cy="0" rx="26" ry="14" fill="#DEDBC8" fill-opacity="0.1" stroke="#DEDBC8" stroke-opacity="0.6" stroke-width="1.2"/>
    <!-- Vehicle chassis vector -->
    <rect x="-12" y="-20" width="24" height="40" rx="7" fill="#1C1C1C" stroke="#DEDBC8" stroke-width="1.5"/>
    <!-- Headlight beams -->
    <polygon points="-8,-20 -18,-55 -3,-55 -6,-20" fill="#FAF8EE" fill-opacity="0.35"/>
    <polygon points="8,-20 6,-55 18,-55 8,-20" fill="#FAF8EE" fill-opacity="0.35"/>
    <!-- Taillight glows -->
    <circle cx="-6" cy="18" r="2.5" fill="#FF5544" fill-opacity="0.8"/>
    <circle cx="6" cy="18" r="2.5" fill="#FF5544" fill-opacity="0.8"/>
    <!-- Interoperability V2X uplink line -->
    <line x1="0" y1="-20" x2="-125" y2="-130" stroke="#DEDBC8" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5"/>
  </g>

  <!-- Central Exchange Core Node (Floating telemetry hub) -->
  <g transform="translate(300, 280)">
    <circle r="36" fill="#141414" stroke="#DEDBC8" stroke-width="1.5"/>
    <circle r="26" fill="none" stroke="#DEDBC8" stroke-opacity="0.35" stroke-dasharray="3 3"/>
    <circle r="12" fill="#FAF8EE" filter="url(#glowBlur)"/>
    <circle r="6" fill="#101010"/>
    <!-- Radiating pulse waves -->
    <circle r="60" stroke="#DEDBC8" stroke-opacity="0.15" stroke-width="1"/>
    <circle r="90" stroke="#DEDBC8" stroke-opacity="0.08" stroke-width="1"/>
  </g>

  <!-- Digital Telemetry Stream Data Readouts -->
  <g font-family="'Almarai', sans-serif" font-size="10" fill="#DEDBC8" opacity="0.75" letter-spacing="1.5">
    <text x="50" y="80">V2X UPLINK: ACTIVE</text>
    <text x="50" y="98" fill="#888677" font-size="8.5">48,920 DATA PACKETS / SEC</text>

    <text x="550" y="80" text-anchor="end">IMDX NATIONAL NODE</text>
    <text x="550" y="98" text-anchor="end" fill="#888677" font-size="8.5">LATENCY: 4.2ms</text>
  </g>

  <!-- Vignette gradient overlay for cinematic integration -->
  <rect width="600" height="900" fill="url(#heroAtmosphere)" opacity="0.35" style="mix-blend-mode: multiply;"/>
</svg>
