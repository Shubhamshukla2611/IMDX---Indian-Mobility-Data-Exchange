<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <radialGradient id="batteryGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#DEDBC8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="traceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEDBC8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#A5A391" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#DEDBC8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#181818"/>
    </linearGradient>
    <linearGradient id="activeLevel" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DEDBC8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FAF8EE" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="36" fill="#121212"/>
  <rect width="200" height="200" rx="36" fill="url(#batteryGlow)"/>
  <rect x="1" y="1" width="198" height="198" rx="35" stroke="#DEDBC8" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Traceability Circuit Grid / Passport Matrix -->
  <g opacity="0.25">
    <path d="M24 60h20v24H24z M32 36h12v12H32z M60 24h24v20H60z" fill="#DEDBC8"/>
    <path d="M24 140h24v24H24z M152 24h24v24h-24z M164 148h16v16h-16z" fill="#DEDBC8"/>
    <path d="M44 72h40 M116 72h40 M72 44v30 M72 126v30 M128 44v30 M128 126v30" stroke="#DEDBC8" stroke-dasharray="2 3" stroke-width="1"/>
  </g>

  <!-- Central EV Battery Pack Module Outline -->
  <rect x="52" y="62" width="96" height="84" rx="14" fill="url(#cellGrad)" stroke="url(#traceGrad)" stroke-width="1.75"/>
  <!-- Battery Terminal Contacts -->
  <rect x="74" y="54" width="16" height="8" rx="3" fill="#DEDBC8" opacity="0.8"/>
  <rect x="110" y="54" width="16" height="8" rx="3" fill="#DEDBC8" opacity="0.8"/>
  <line x1="82" y1="58" x2="82" y2="58.01" stroke="#121212" stroke-width="3" stroke-linecap="round"/>
  <path d="M115 58h6 M118 55v6" stroke="#121212" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cylindrical Cell Array (Modular cells inside pack) -->
  <g transform="translate(62, 74)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="20" height="26" rx="5" fill="#1E1E1E" stroke="#DEDBC8" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="3" y="10" width="14" height="13" rx="3" fill="url(#activeLevel)"/>

    <rect x="28" y="0" width="20" height="26" rx="5" fill="#1E1E1E" stroke="#DEDBC8" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="31" y="6" width="14" height="17" rx="3" fill="url(#activeLevel)"/>

    <rect x="56" y="0" width="20" height="26" rx="5" fill="#1E1E1E" stroke="#DEDBC8" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="59" y="4" width="14" height="19" rx="3" fill="url(#activeLevel)"/>

    <!-- Row 2 -->
    <rect x="0" y="34" width="20" height="26" rx="5" fill="#1E1E1E" stroke="#DEDBC8" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="3" y="42" width="14" height="15" rx="3" fill="url(#activeLevel)"/>

    <rect x="28" y="34" width="20" height="26" rx="5" fill="#1E1E1E" stroke="#DEDBC8" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="31" y="38" width="14" height="19" rx="3" fill="url(#activeLevel)"/>

    <rect x="56" y="34" width="20" height="26" rx="5" fill="#1E1E1E" stroke="#DEDBC8" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="59" y="44" width="14" height="13" rx="3" fill="url(#activeLevel)"/>
  </g>

  <!-- Digital Passport / SOH Verification Badge -->
  <g transform="translate(132, 126)">
    <circle cx="16" cy="16" r="16" fill="#181818" stroke="#DEDBC8" stroke-width="1.5"/>
    <!-- Traceability checkmark & leaf / energy icon -->
    <path d="M11 16.5l3.5 3.5 7.5-8" stroke="#DEDBC8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SOH Metric & Passport Text Marker -->
  <text x="100" y="168" fill="#DEDBC8" font-family="'Almarai', sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.5" text-anchor="middle" opacity="0.85">BATTERY SOH: 98.4%</text>
  <text x="100" y="181" fill="#A5A391" font-family="'Almarai', sans-serif" font-size="8.5" letter-spacing="2" text-anchor="middle" opacity="0.6">IMDX TRACE ID #IN-8891</text>
</svg>
