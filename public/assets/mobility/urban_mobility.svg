<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <radialGradient id="urbanGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#DEDBC8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#121212" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="routeLineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEDBC8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9E9B8B" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="routeLineGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ECEADF"/>
      <stop offset="100%" stop-color="#6F6D60"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="200" height="200" rx="36" fill="#121212"/>
  <rect width="200" height="200" rx="36" fill="url(#urbanGlow)"/>
  <rect x="1" y="1" width="198" height="198" rx="35" stroke="#DEDBC8" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Urban Grid Blueprint Lines -->
  <g opacity="0.15" stroke="#DEDBC8" stroke-width="1">
    <line x1="30" y1="20" x2="30" y2="180"/>
    <line x1="70" y1="20" x2="70" y2="180"/>
    <line x1="100" y1="20" x2="100" y2="180"/>
    <line x1="130" y1="20" x2="130" y2="180"/>
    <line x1="170" y1="20" x2="170" y2="180"/>

    <line x1="20" y1="35" x2="180" y2="35"/>
    <line x1="20" y1="75" x2="180" y2="75"/>
    <line x1="20" y1="105" x2="180" y2="105"/>
    <line x1="20" y1="135" x2="180" y2="135"/>
    <line x1="20" y1="165" x2="180" y2="165"/>
  </g>

  <!-- Metro / Highway Arteries (Overpass & Multimodal Interchanges) -->
  <!-- Arterial Route 1 (Curved Express Corridor) -->
  <path d="M25 155 C 65 145, 80 110, 100 100 S 145 75, 175 45" stroke="url(#routeLineGrad1)" stroke-width="3" stroke-linecap="round"/>
  <!-- Arterial Route 2 (Rapid Transit Metro Loop) -->
  <path d="M35 50 C 70 65, 95 90, 100 100 S 130 140, 165 155" stroke="url(#routeLineGrad2)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 4"/>
  <!-- Arterial Route 3 (Ring Feeder) -->
  <ellipse cx="100" cy="100" rx="46" ry="28" stroke="#DEDBC8" stroke-width="1" stroke-opacity="0.3" transform="rotate(-15 100 100)"/>

  <!-- Multimodal Transit Hubs & Nodes -->
  <!-- Central Mega-Hub -->
  <g transform="translate(100, 100)">
    <circle r="12" fill="#1E1E1E" stroke="#DEDBC8" stroke-width="1.75"/>
    <circle r="6" fill="#DEDBC8"/>
    <circle r="18" fill="none" stroke="#DEDBC8" stroke-opacity="0.3" stroke-dasharray="2 3"/>
  </g>

  <!-- Transit Node West (Bus Rapid Transit) -->
  <g transform="translate(62, 134)">
    <circle r="7" fill="#181818" stroke="#DEDBC8" stroke-width="1.5"/>
    <circle r="3.5" fill="#DEDBC8"/>
  </g>

  <!-- Transit Node East (Metro Station) -->
  <g transform="translate(142, 66)">
    <circle r="7" fill="#181818" stroke="#DEDBC8" stroke-width="1.5"/>
    <circle r="3.5" fill="#DEDBC8"/>
  </g>

  <!-- Transit Node South (Freight / Fleet Corridor) -->
  <g transform="translate(136, 142)">
    <circle r="6" fill="#181818" stroke="#DEDBC8" stroke-width="1.25"/>
    <circle r="2.5" fill="#DEDBC8" opacity="0.8"/>
  </g>

  <!-- Transit Node North-West (Micro-mobility Hub) -->
  <g transform="translate(56, 58)">
    <circle r="6" fill="#181818" stroke="#DEDBC8" stroke-width="1.25"/>
    <circle r="2.5" fill="#DEDBC8" opacity="0.8"/>
  </g>

  <!-- Traffic Heat / Density Pulse Rings -->
  <circle cx="100" cy="100" r="32" stroke="#DEDBC8" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="100" cy="100" r="54" stroke="#DEDBC8" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Legend / Label -->
  <text x="100" y="181" fill="#DEDBC8" font-family="'Almarai', sans-serif" font-size="9" font-weight="600" letter-spacing="1.75" text-anchor="middle" opacity="0.85">MULTIMODAL TRANSIT RADAR</text>
</svg>
